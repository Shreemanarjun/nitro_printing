<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NitroPrint — nitro_printing plugin example">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090D1A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NitroPrint">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NitroPrint Demo</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #090D1A;
    }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      background:
        radial-gradient(600px 400px at 50% 38%, rgba(99, 102, 241, .10), transparent 70%),
        #090D1A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #E2E8F0;
      /* Hidden until the load proves slow — warm cached loads never see it. */
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease;
      -webkit-user-select: none;
      user-select: none;
    }
    #splash.show {
      opacity: 1;
      pointer-events: auto;
    }
    #splash.gone {
      opacity: 0;
      pointer-events: none;
    }
    #splash .tile {
      width: 84px;
      height: 84px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #818CF8, #6366F1 55%, #4F46E5);
      box-shadow: 0 12px 40px rgba(99, 102, 241, .35);
      animation: breathe 2.2s ease-in-out infinite;
    }
    #splash .tile svg {
      width: 44px;
      height: 44px;
      fill: #fff;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1);    box-shadow: 0 12px 40px rgba(99,102,241,.35); }
      50%      { transform: scale(1.05); box-shadow: 0 16px 52px rgba(99,102,241,.50); }
    }
    #splash .name {
      margin-top: 26px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: .3px;
    }
    #splash .sub {
      margin-top: 6px;
      font-size: 13px;
      color: #64748B;
    }
    #splash .bar {
      margin-top: 30px;
      width: 180px;
      height: 3px;
      border-radius: 3px;
      overflow: hidden;
      background: #1E293B;
    }
    #splash .bar i {
      display: block;
      height: 100%;
      width: 40%;
      border-radius: 3px;
      background: linear-gradient(90deg, #6366F1, #A5B4FC);
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(450%); }
    }
    #splash .hint {
      margin-top: 16px;
      font-size: 11px;
      letter-spacing: .4px;
      color: #475569;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="tile">
      <!-- printer glyph (Material "print") -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/>
      </svg>
    </div>
    <div class="name">NitroPrint</div>
    <div class="sub">Plugin Example</div>
    <div class="bar"><i></i></div>
    <div class="hint">Loading print engine</div>
  </div>

  <script>
    // Show the splash only when loading is actually slow: if Flutter's first
    // frame lands within 300ms (warm cache), it is removed before ever
    // becoming visible — no flash on repeat visits.
    (function () {
      var splash = document.getElementById('splash');
      // Repeat visits in this session boot warm — hold the splash back much
      // longer so it only appears if something is genuinely slow.
      var visited = false;
      try { visited = !!sessionStorage.getItem('np-loaded'); } catch (e) {}
      var showTimer = setTimeout(function () {
        splash.classList.add('show');
      }, visited ? 1500 : 300);
      window.addEventListener('flutter-first-frame', function () {
        clearTimeout(showTimer);
        try { sessionStorage.setItem('np-loaded', '1'); } catch (e) {}
        if (!splash) return;
        if (splash.classList.contains('show')) {
          splash.classList.add('gone');
          splash.addEventListener('transitionend', function () { splash.remove(); });
        } else {
          splash.remove();
        }
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
