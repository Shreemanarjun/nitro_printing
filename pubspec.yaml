name: nitro_printing
description: >-
  A high-performance Flutter printing plugin built on Nitro for Flutter.
  Supports text, image, PDF, raw/ESC-POS/ZPL printing, print-job management,
  mDNS printer discovery, IPP status queries, and a built-in print-settings UI —
  all with zero method-channel overhead.
version: 0.0.5
homepage: https://github.com/Shreemanarjun/nitro_printing
repository: https://github.com/Shreemanarjun/nitro_printing
issue_tracker: https://github.com/Shreemanarjun/nitro_printing/issues
documentation: https://nitro.shreeman.dev
funding:
  - https://buymeacoffee.com/shreemanarjun

topics:
  - printing
  - nitro
  - ffi
  - pdf
  - escpos

environment:
  sdk: ^3.11.5
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  nitro: ^0.7.4
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  test: ^1.25.8
  stream_channel: ^2.1.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  nitro_generator: ^0.7.4

flutter:
  assets:
    - assets/web/
  plugin:
    platforms:
      android:
        pluginClass: NitroPrintingPlugin
        package: dev.shreeman.nitro_printing
        ffiPlugin: true
      ios:
        pluginClass: SwiftNitroPrintingPlugin
        ffiPlugin: true
      macos:
        pluginClass: SwiftNitroPrintingPlugin
        ffiPlugin: true
      # Desktop is a pure FFI plugin (the C++ impl auto-registers via a
      # constructor) — declaring a pluginClass here makes Flutter expect a
      # method-channel `nitro_printing_plugin` target that does not exist.
      windows:
        ffiPlugin: true
      linux:
        ffiPlugin: true
