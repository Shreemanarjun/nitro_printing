name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the repo and run tests/builds.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    if: false  # TEMP(ios-only fast iteration): re-enable before merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter pub get
        working-directory: example
      - run: flutter analyze lib example/lib example/integration_test example/patrol_test

  android:
    name: Android (API 34 emulator)
    if: false  # TEMP(ios-only fast iteration): re-enable before merge
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: API + transport integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd example && flutter test integration_test -d emulator-5554
      - name: Patrol suites
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            dart pub global activate patrol_cli
            cd example && patrol test -d emulator-5554

  ios:
    name: iOS (simulator)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - name: Boot simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "import json,sys; devs=[d for r in json.load(sys.stdin)['devices'].values() for d in r if 'iPhone' in d['name']]; print(devs[-1]['udid'])")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      # Run each file separately — the iOS embedder can hang relaunching the
      # app between files in one `flutter test integration_test` invocation.
      - name: API integration tests
        env: { UDID: '${{ steps.sim.outputs.udid }}' }
        run: flutter test integration_test/nitro_printing_test.dart -d "$UDID"
        working-directory: example
      - name: Native transport tests
        env: { UDID: '${{ steps.sim.outputs.udid }}' }
        run: flutter test integration_test/native_transport_test.dart -d "$UDID"
        working-directory: example
      - name: Patrol suites
        env: { UDID: '${{ steps.sim.outputs.udid }}' }
        run: |
          dart pub global activate patrol_cli
          (cd ios && pod install)
          patrol test -d "$UDID" --verbose
        working-directory: example

  macos:
    name: macOS (desktop)
    if: false  # TEMP(ios-only fast iteration): re-enable before merge
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
        working-directory: example
      # Desktop embedding can fail to relaunch the app between test files in a
      # single `flutter test integration_test` invocation — run files separately.
      - name: API integration tests
        run: flutter test integration_test/nitro_printing_test.dart -d macos
        working-directory: example
      - name: Native transport tests
        run: flutter test integration_test/native_transport_test.dart -d macos
        working-directory: example

  linux:
    name: Linux (desktop)
    if: false  # TEMP(ios-only fast iteration): re-enable before merge
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev xvfb
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
        working-directory: example
      - name: Build
        run: flutter build linux --debug
        working-directory: example
      - name: API integration tests (headless X)
        run: xvfb-run -a flutter test integration_test/nitro_printing_test.dart -d linux
        working-directory: example
      - name: Native transport tests (headless X)
        run: xvfb-run -a flutter test integration_test/native_transport_test.dart -d linux
        working-directory: example

  windows:
    name: Windows (desktop)
    if: false  # TEMP(ios-only fast iteration): re-enable before merge
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
        working-directory: example
      - name: Build
        run: flutter build windows --debug
        working-directory: example
      - name: API integration tests
        run: flutter test integration_test/nitro_printing_test.dart -d windows
        working-directory: example
      - name: Native transport tests
        run: flutter test integration_test/native_transport_test.dart -d windows
        working-directory: example
